# nginx pour l'application Weeb (SPA React + Vite).
# Servi sur /usr/share/nginx/html par l'image finale.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # --- Compression ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # --- En-têtes de sécurité ---
    # Attention : nginx n'hérite PAS des add_header si un bloc enfant en définit un.
    # Ces trois en-têtes sont donc déclarés au niveau serveur et aucun add_header
    # n'est utilisé dans les "location" ci-dessous (on passe par `expires`).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # --- Assets produits par Vite : noms hashés, cache très long ---
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # --- index.html : pas de cache, sinon les vieux hashs d'assets sont servis ---
    location = /index.html {
        expires -1;
    }

    # --- Fallback SPA : indispensable pour react-router (createBrowserRouter) ---
    # /contact, /blog, /blog/42, /signup, /password-reset servent index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
