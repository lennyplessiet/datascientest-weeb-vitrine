name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Annule les exécutions en cours quand on repousse sur la même branche
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: true
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          # Doit rester >= 20.19 (exigence de Vite 7) ; Vercel utilise Node 22
          node-version: 22
          cache: npm

      - name: Installation des dépendances
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tests unitaires (Vitest)
        run: npm test

      - name: Build de production (Vite)
        run: npm run build

      # Garde-fou : un chemin /src/assets en dur casserait toutes les images en prod
      - name: Vérification des assets du build
        run: |
          if grep -rIl "src/assets" dist; then
            echo "::error::Le build contient des chemins /src/assets (images cassées en production)"
            exit 1
          fi
          echo "Aucun chemin /src/assets dans dist ✓"

      - name: Publication du build
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: dist
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Vérifie que Docker Hub est configuré (sinon la publication est sautée)
  # ---------------------------------------------------------------------------
  docker-config:
    name: Config Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: quality
    if: github.event_name != 'pull_request'
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Vérification des secrets
        id: check
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Secrets Docker Hub détectés : la publication est activée."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Docker Hub::Secrets DOCKERHUB_USERNAME / DOCKERHUB_TOKEN absents : publication de l'image ignorée."
          fi

  # ---------------------------------------------------------------------------
  # Publication de l'image sur Docker Hub (uniquement si les tests passent)
  # ---------------------------------------------------------------------------
  docker:
    name: Image Docker Hub
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality, docker-config]
    # Jamais depuis une PR (secrets indisponibles) ni depuis un fork
    if: github.event_name != 'pull_request' && needs.docker-config.outputs.configured == 'true'
    permissions:
      contents: read
    env:
      IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/datascientest-weeb-vitrine
    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Vérification du nom d'image
        run: |
          IMAGE_USER="${IMAGE_NAME%%/*}"
          echo "Image cible : $IMAGE_NAME"
          if [ -z "$IMAGE_USER" ]; then
            echo "::error::Le secret DOCKERHUB_USERNAME est vide : impossible de nommer l'image."
            exit 1
          fi
          case "$IMAGE_USER" in
            *[!A-Za-z0-9._-]*)
              echo "::error::Le secret DOCKERHUB_USERNAME contient un caractère invalide (espace, retour à la ligne…)."
              exit 1 ;;
          esac

      - name: Configuration de Buildx
        uses: docker/setup-buildx-action@v3

      - name: Connexion à Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Calcul des tags et labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha,format=short,prefix=sha-
            type=semver,pattern={{version}}

      - name: Build et publication
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Variables Vite inlinées au build de l'image
          build-args: |
            VITE_API_BASE_URL=${{ vars.VITE_API_BASE_URL || 'http://localhost:8000' }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            VITE_SENTRY_ENVIRONMENT=production
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Récapitulatif
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo "### Image publiée sur Docker Hub"
            echo ""
            echo '```'
            echo "$TAGS"
            echo '```'
            echo ""
            echo "Digest : \`$DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"
